# BrowserStack Automate config for `npm run test:browserstack` (browserstack-node-sdk).
# Credentials come from the environment; never commit them.
userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: Cartwheel
buildName: cartwheel-e2e

# Tunnel to the storefront running on this machine (http://localhost:5001).
browserstackLocal: true

# Sessions at once. Every test resets the app server it talks to, so each session needs its own:
# with one server (the default) keep this at 1. To run N at once, start N servers on different
# ports, list them in BASE_URLS (see "Running reliably" in the README) and set this to N.
# Keep exactly one platform uncommented: platforms listed together would share the same servers.
parallelsPerPlatform: 1

platforms:
  - os: Windows
    osVersion: 11
    browserName: chrome
    browserVersion: latest

# Other platforms. To run on one, swap it in for the platform above and run the suite again.
# Run them one at a time, never several in the same run.
#
